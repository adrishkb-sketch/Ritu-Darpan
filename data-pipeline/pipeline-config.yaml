data_sources:
  ground_imd:
    rainfall: "https://www.imdpune.gov.in/cmpg/Griddata/Rainfall25Bin.html"
    maxtemp: "https://www.imdpune.gov.in/cmpg/Griddata/Max1_Bin.html"
    mintemp: "https://www.imdpune.gov.in/cmpg/Griddata/Min1_Bin.html"

  satellite_insat:
    lst: "https://www.mosdac.gov.in/3RIMGL2BLST"
    sst: "https://www.mosdac.gov.in/3RIMGL2BSST"
    rainfall: "https://www.mosdac.gov.in/3RIMGL2BIMC"

paths:
  # Using absolute paths or relative to script location is safer
  raw_imd_dir: "raw/imd/"
  raw_mosdac_dir: "raw/mosdac/"
  processed_data_dir: "processed/"
  output_file: "india_climate_master.csv"

grid_settings:
  # Resolution of target Digital Twin grid (0.05 deg = ~5 km)
  resolution_deg: 0.05

spatial_settings:
  # Bounding Box coordinates for West Bengal (with a small buffer)
  pilot_region: "West Bengal"
  lat_min: 21.0
  lat_max: 27.5
  lon_min: 85.5
  lon_max: 90.0

temporal_settings:
  start_year: 2021
  end_year: 2023

thresholds:
  temp_zscore_limit: 3.0
  rain_zscore_limit: 4.0

cloudinary:
  cloud_name: ""
  api_key: ""
  api_secret: ""

